openapi: 3.0.3
info:
  title: AI-buddy API
  version: 0.1.0
  description: |
    HTTP API для MVP адаптации стажёра.
    Стажёр знакомится с командой и получает все обязательные доступы.
    Руководитель рассматривает заявки, назначенные ему на согласование.
    Реализованы Auth, карточка GET /onboarding/tasks/working-accesses,
    AccessRequests и MLTools. Остальные маршруты плана, знакомства и чата —
    целевой контракт; они помечены x-implementation-status: planned и пока
    не зарегистрированы в Go API.
servers:
  - url: http://localhost:8080/api/v1
    description: Адрес локального бэкенда
security:
  - demoIdentity: []
tags:
  - name: Auth
    description: Вход и профиль
  - name: Onboarding
    description: План адаптации и задания
  - name: Chat
    description: Отдельный диалог для каждого рабочего задания
  - name: AccessRequests
    description: Черновики, заявки и согласование
  - name: MLTools
    description: Внутренние операции для ML-сервера с отдельным Bearer-токеном

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Найти демо-профиль по почте или внутреннему ID
      description: |
        Backend находит сотрудника и его роль в тестовом справочнике.
        Если профиль уже заполнен, возвращается ready и роль для выбора экрана.
        При первом входе возвращается registration_required с назначенной командой,
        её наставниками и вариантами должности.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              email:
                value: {identifier: alina.search@example.test}
              employeeId:
                value: {identifier: intern-alina}
      responses:
        '200':
          description: Результат поиска профиля в тестовом справочнике.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              examples:
                internReady:
                  value:
                    status: ready
                    profile:
                      id: profile-intern-alina
                      employeeId: intern-alina
                      firstName: Алина
                      secondName: Смирнова
                      email: alina.search@example.test
                      role: intern
                      position: Backend-разработчик Go
                      team: {id: team-search, name: Поиск}
                      mentor: {id: mentor-katya, firstName: Катя, secondName: Волкова}
                      internshipStartDate: '2026-11-10'
                managerReady:
                  value:
                    status: ready
                    profile:
                      id: profile-manager-dmitry
                      employeeId: manager-dmitry
                      firstName: Дмитрий
                      secondName: Орлов
                      email: dmitry.search@example.test
                      role: manager
                      position: Руководитель команды
                      team: {id: team-search, name: Поиск}
                newIntern:
                  value:
                    status: registration_required
                    employeeId: intern-ivan
                    firstName: Иван
                    secondName: Петров
                    email: ivan.web@example.test
                    role: intern
                    positionId: position-frontend
                    team:
                      id: team-web
                      name: Веб-интерфейсы
                      mentors:
                        - {id: mentor-oleg, firstName: Олег, secondName: Морозов}
                    positionOptions:
                      - {id: position-frontend, name: Frontend-разработчик}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Почта или ID отсутствуют в тестовом справочнике.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {code: demo_employee_not_found, message: Проверь демо-почту или внутренний ID.}
        '409':
          description: Назначенная команда, наставники или должности не подготовлены в справочниках.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {code: registration_unavailable, message: Обратись к организатору демо.}

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerProfile
      summary: Заполнить профиль сотрудника
      description: |
        Использует employeeId из результата registration_required в заголовке X-Demo-Employee-Id.
        Команда назначена сотруднику в корпоративном справочнике и в форме доступна для просмотра.
        Backend проверяет должность и принадлежность наставника назначенной команде.
        Стажёр указывает наставника и дату начала стажировки. Руководитель может выбрать должность.
        Если positionId пропущен, используется текущая должность.
        Имя, почта и роль берутся из тестового справочника. Должность и профиль сохраняются
        в одной транзакции.
        Повтор с теми же данными возвращает сохранённый профиль.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
            example:
              positionId: position-frontend
              mentorId: mentor-oleg
              internshipStartDate: '2026-11-10'
      responses:
        '201':
          description: Профиль сохранён. Интерфейс открывает экран по роли сотрудника.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: profile-intern-ivan
                employeeId: intern-ivan
                firstName: Иван
                secondName: Петров
                email: ivan.web@example.test
                role: intern
                position: Frontend-разработчик
                team: {id: team-web, name: Веб-интерфейсы}
                mentor: {id: mentor-oleg, firstName: Олег, secondName: Морозов}
                internshipStartDate: '2026-11-10'
        '200':
          description: Профиль с этими данными уже был сохранён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Для этого сотрудника уже заполнен профиль с другими данными.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {code: profile_already_exists, message: Открой существующий профиль.}

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Получить профиль текущего пользователя
      responses:
        '200':
          description: Имя, роль, должность, команда и рабочая почта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /onboarding:
    get:
      x-implementation-status: planned
      tags: [Onboarding]
      operationId: getOnboardingPlan
      summary: Загрузить экран «Мой план»
      description: |
        Доступно стажёру. Возвращает три этапа, следующий шаг, счётчик доступов и данные сайдбара.
        После выдачи или подтверждения знакомства фронтенд может обновить план этим запросом.
      responses:
        '200':
          description: План текущего стажёра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingPlan'
              example:
                tasks:
                  - {id: team-intro, title: Знакомство с командой, subtitle: 'Команда, руководитель и наставник', status: completed}
                  - {id: working-accesses, title: Рабочие доступы, subtitle: Ресурсы команды, status: in_progress}
                  - {id: first-task, title: Первая задача, subtitle: Учебная задача от руководителя, status: locked}
                progress: {completed: 1, total: 3}
                accessProgress: {completed: 2, total: 4}
                nextTaskId: working-accesses
                accessRequestSummary: {pending: 0, inProgress: 0, processed: 1}
                upcomingMeeting:
                  title: Встреча с наставником
                  mentorName: Катя Волкова
                  startsAt: '2026-11-11T11:30:00+03:00'
                  endsAt: '2026-11-11T12:00:00+03:00'
                  format: Онлайн
                  agenda: Обсудить первые дни в команде и рабочие доступы.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /onboarding/tasks/working-accesses:
    get:
      tags: [Onboarding]
      operationId: getWorkingAccesses
      summary: Получить карточку рабочих доступов
      description: |
        Реализованный маршрут для стажёра с заполненным профилем.
        Возвращает TaskDetails с id=working-accesses, ресурсами и прогрессом.
        canRequest=true только для requestable; pending, issuing и failed
        содержат активную заявку. Прогресс растёт после подтверждённой выдачи.
      responses:
        '200':
          description: Карточка рабочих доступов и сохранённый прогресс.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      x-implementation-status: planned
      tags: [Onboarding]
      operationId: getOnboardingTask
      summary: Открыть пункт плана
      description: |
        Доступно стажёру. Для знакомства возвращает teamIntro, для доступов workingAccesses.
        Первая задача возвращает описание заглушки и статус locked или coming_soon.
      responses:
        '200':
          description: Карточка выбранного пункта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetails'
              examples:
                teamIntro:
                  value:
                    id: team-intro
                    title: Знакомство с командой
                    subtitle: Команда, руководитель и наставник
                    status: completed
                    description: Узнай, чем занимается команда и к кому обращаться.
                    chatEnabled: true
                    teamIntro:
                      team: {id: team-search, name: Поиск}
                      description: Команда отвечает за поисковый сервис.
                      manager: {fullName: Дмитрий Орлов, position: Руководитель команды}
                      mentor: {fullName: Катя Волкова, position: Наставник, email: katya.volkova@example.test}
                workingAccesses:
                  value:
                    id: working-accesses
                    title: Рабочие доступы
                    subtitle: Ресурсы команды
                    status: in_progress
                    description: Проверь доступы к ресурсам команды.
                    chatEnabled: true
                    workingAccesses:
                      progress: {completed: 2, total: 4, inProgress: 0, failed: 0}
                      resources:
                        - id: team-wiki
                          service: wiki
                          name: Вики команды
                          accessLevel: read
                          purpose: Инструкции и процессы команды
                          status: granted
                          canRequest: false
                        - id: youtrack-search
                          service: youtrack
                          name: YouTrack
                          accessLevel: member
                          purpose: Работа с задачами команды
                          status: granted
                          canRequest: false
                        - id: gitlab-search-api
                          service: gitlab
                          name: GitLab · search-api
                          accessLevel: Developer
                          purpose: Код и работа с ветками
                          status: requestable
                          canRequest: true
                        - id: grafana-search
                          service: grafana
                          name: Grafana · Поиск
                          accessLevel: Viewer
                          purpose: Дашборды тестового окружения
                          status: requestable
                          canRequest: true
                firstTask:
                  value:
                    id: first-task
                    title: Первая задача
                    subtitle: Учебная задача от руководителя
                    status: locked
                    description: Познакомься с командой и получи обязательные доступы.
                    chatEnabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          description: Ошибка чтения данных или настройки обязательных доступов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {code: internal_error, message: Не удалось загрузить рабочие доступы. Попробуй позже.}

  /onboarding/tasks/team-intro/complete:
    post:
      x-implementation-status: planned
      tags: [Onboarding]
      operationId: completeTeamIntro
      summary: Отметить знакомство
      description: Доступно стажёру. Повторное нажатие возвращает актуальный план с сохранённой отметкой.
      responses:
        '200':
          description: План с обновлённым статусом знакомства и прогрессом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /onboarding/tasks/{taskId}/chat:
    parameters:
      - $ref: '#/components/parameters/ChatTaskId'
    get:
      x-implementation-status: planned
      tags: [Chat]
      operationId: getTaskChat
      summary: Получить историю чата и статус последнего ответа
      description: |
        Доступно стажёру для своего задания. Пока latestRun имеет статус queued или running,
        фронтенд периодически запрашивает этот маршрут. Сообщения идут от старых к новым.
      responses:
        '200':
          description: Переписка задания и состояние обработки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskChat'
              example:
                taskId: team-intro
                messages:
                  - id: msg-1
                    role: user
                    text: Кто мой наставник?
                    createdAt: '2026-11-10T14:00:00+03:00'
                  - id: msg-2
                    role: assistant
                    text: Твой наставник — Катя Волкова.
                    createdAt: '2026-11-10T14:00:02+03:00'
                    replyToMessageId: msg-1
                    sourceLabel: Карточка команды
                latestRun: {id: run-1, userMessageId: msg-1, status: completed, assistantMessageId: msg-2}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /onboarding/tasks/{taskId}/chat/messages:
    parameters:
      - $ref: '#/components/parameters/ChatTaskId'
    post:
      x-implementation-status: planned
      tags: [Chat]
      operationId: sendTaskChatMessage
      summary: Отправить вопрос AI-buddy
      description: |
        Доступно стажёру для своего задания. Backend сохраняет сообщение и ставит ответ в очередь.
        В каждом чате одновременно обрабатывается один ответ.
        Ключ повтора относится к текущему стажёру и заданию. Повтор с тем же ключом
        и текстом возвращает состояние исходной обработки даже после начала следующего ответа.
        После ошибки обработки стажёр может отправить вопрос с новым ключом.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageInput'
            example: {text: 'Кто мой наставник?'}
      responses:
        '202':
          description: Сообщение сохранено. Ответ ожидает обработки или уже готовится.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChatRun'
                  - properties:
                      status: {type: string, enum: [queued, running]}
              example: {id: run-1, userMessageId: msg-1, status: queued}
        '200':
          description: Повтор запроса, обработка которого завершилась.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChatRun'
                  - properties:
                      status: {type: string, enum: [completed, failed]}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: В этом чате уже готовится ответ или этот ключ использован для другого сообщения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  value: {code: chat_busy, message: Дождись ответа в этом чате.}
                keyReused:
                  value: {code: idempotency_key_reused, message: Для нового сообщения нужен новый ключ.}

  /access-requests/drafts/{draftId}/confirm:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [AccessRequests]
      operationId: confirmAccessDraft
      summary: Подтвердить черновик одного доступа
      description: |
        Вызывается действием сотрудника в интерфейсе чата после показа параметров.
        Черновик готовится Go-сервисом доступа по явному намерению агента
        prepare_access_request; публичного маршрута подготовки или произвольного
        создания заявки нет. Агент не может сам создать или подтвердить заявку.
        Владельца определяет X-Demo-Employee-Id, остальные параметры берутся из черновика.
        Backend повторно проверяет условия и атомарно создаёт одну заявку pending.
        Повтор возвращает ту же заявку в её актуальном состоянии, даже после истечения
        срока черновика. Метод не регистрируется как автономный инструмент LLM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessConfirmation'
            example: {confirmed: true}
      responses:
        '201':
          description: Создана одна заявка на согласование.
          headers:
            Location:
              description: Относительный адрес карточки созданной заявки.
              schema: {type: string, example: /api/v1/access-requests/request-1}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '200':
          description: Повтор подтверждения; возвращается ранее созданная заявка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: Неверный JSON или отсутствует явное confirmed=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                confirmationRequired:
                  value: {code: confirmation_required, message: Подтверди отправку выбранного черновика.}
                invalidInput:
                  value: {code: invalid_input, message: Проверь параметры запроса.}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccessDraftNotFound'
        '409':
          $ref: '#/components/responses/AccessConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /access-requests:
    get:
      tags: [AccessRequests]
      operationId: listAccessRequests
      summary: Получить свои заявки или очередь согласования
      description: |
        Стажёр получает свои заявки с фильтрами. Руководитель получает только
        назначенные ему pending; group, status и resourceId для него игнорируются.
        limit и offset работают для обеих ролей. Заявки отсортированы от новых к старым.
        total — размер списка до пагинации; counts — счётчики до применения фильтров.
        Для руководителя counts учитывает только очередь pending.
        Неизвестные и повторяющиеся query-параметры возвращают 400.
      parameters:
        - name: group
          in: query
          description: Для стажёра active включает pending, issuing, failed; completed — granted и rejected.
          schema: {type: string, enum: [all, active, completed], default: all}
        - name: status
          in: query
          description: Дополнительный фильтр стажёра; действует совместно с group.
          schema:
            $ref: '#/components/schemas/AccessRequestStatus'
        - name: resourceId
          in: query
          description: Фильтр стажёра по ID ресурса.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Страница заявок и счётчики, прочитанные из одного снимка БД.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestList'
              example:
                items: []
                total: 0
                counts: {total: 0, active: 0, completed: 0, pending: 0, issuing: 0, granted: 0, rejected: 0, failed: 0}
                limit: 20
                offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /access-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    get:
      tags: [AccessRequests]
      operationId: getAccessRequest
      summary: Открыть карточку заявки
      description: |
        Стажёр видит свою заявку, назначенный руководитель — заявку в любом статусе,
        в том числе после её исчезновения из очереди согласования.
        Чужая и отсутствующая заявки возвращают одинаковый 404.
        Для обновления статуса frontend может периодически запрашивать карточку.
      responses:
        '200':
          description: Сохранённые параметры и актуальное состояние заявки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccessRequestNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /access-requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [AccessRequests]
      operationId: decideAccessRequest
      summary: Одобрить или отклонить заявку
      description: |
        Решение принимает только назначенный руководитель по заявке pending.
        При одобрении сохраняются issuing и задание на выдачу в одной транзакции.
        При отказе сохраняется rejected с обязательной причиной reason.
        Повтор того же решения с той же причиной возвращает текущее состояние заявки;
        другое решение или другая причина после решения возвращают 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDecision'
            examples:
              approve:
                value: {decision: approve}
              reject:
                value: {decision: reject, reason: Уточни назначение доступа.}
      responses:
        '200':
          description: Решение сохранено либо возвращён результат повторного вызова.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccessRequestNotFound'
        '409':
          $ref: '#/components/responses/AccessConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /access-requests/{requestId}/retry:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [AccessRequests]
      operationId: retryAccessIssuance
      summary: Повторить выдачу по существующей заявке
      description: |
        Доступно только назначенному руководителю. Тело запроса не требуется.
        Заявка failed и её незавершённое задание возвращаются в выдачу атомарно.
        Новая заявка не создаётся. При issuing или granted повтор ничего не меняет.
        Перед повторной выдачей обработчик проверит фактические права.
      responses:
        '200':
          description: Актуальная заявка issuing или granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccessRequestNotFound'
        '409':
          $ref: '#/components/responses/AccessConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/ml/tools:
    get:
      tags: [MLTools]
      operationId: listMLTools
      summary: Получить описания четырёх инструментов агента
      description: Маршрут включён только при непустом ML_TOOLS_TOKEN. Контекст сотрудника для списка схем не требуется.
      security:
        - mlServiceToken: []
      responses:
        '200':
          description: Имена, описания и JSON Schema аргументов. Подтверждение и выдача не входят в список.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MLToolDefinition'
        '401':
          description: Неверный сервисный токен; code=ml_service_unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/ml/tools/{toolName}:
    post:
      tags: [MLTools]
      operationId: callMLTool
      summary: Выполнить инструмент в контексте текущего сотрудника
      description: |
        Требует ML_TOOLS_TOKEN и демо-ID сотрудника, установленного вызывающим сервером.
        ID сотрудника, уровень, согласующего и подтверждение нельзя передать в JSON.
        get_role_tools принимает {} и возвращает WorkingAccesses.
        check_tool_access принимает resourceId и возвращает MLToolAccess без выдачи прав.
        prepare_access_request принимает resourceId и возвращает MLAccessPreparation.
        get_access_request_status принимает requestId и возвращает AccessRequest.
        Подготовка создаёт один черновик; явное подтверждение выполняется пользовательским API.
        При пустом ML_TOOLS_TOKEN маршруты не регистрируются (404).
      security:
        - mlServiceToken: []
          demoIdentity: []
      parameters:
        - name: toolName
          in: path
          required: true
          schema:
            type: string
            enum: [get_role_tools, check_tool_access, prepare_access_request, get_access_request_status]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MLNoArguments'
                - $ref: '#/components/schemas/MLResourceArguments'
                - $ref: '#/components/schemas/MLRequestArguments'
            examples:
              resources: {value: {}}
              resource: {value: {resourceId: gitlab-search-api}}
              request: {value: {requestId: request-1042}}
      responses:
        '200':
          description: Результат выбранного инструмента без дополнительной обёртки.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkingAccesses'
                  - $ref: '#/components/schemas/MLToolAccess'
                  - $ref: '#/components/schemas/MLAccessPreparation'
                  - $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: code=ml_service_unauthorized при неверном токене; demo_identity_required при неизвестном или отсутствующем сотруднике.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: resource_not_required, request_not_found или tool_not_found; чужие ресурсы и заявки не раскрываются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: resource_changed или requirements_not_configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: access_check_unavailable — сбой или тайм-аут проверки провайдера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    mlServiceToken:
      type: http
      scheme: bearer
      description: Сервисный секрет ML_TOOLS_TOKEN. Не передаётся браузеру и LLM.
    demoIdentity:
      type: apiKey
      in: header
      name: X-Demo-Employee-Id
      description: |
        Внутренний ID вымышленного сотрудника из POST /auth/login.
        Интерфейс держит ID в памяти вкладки и заново запрашивает его при открытии или перезагрузке.
        Backend проверяет роль по справочнику при каждом запросе. Для рабочих экранов нужен
        заполненный профиль. Заголовок предназначен для изолированного демо.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'
    ChatTaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ChatTaskId'
    DraftId:
      name: draftId
      in: path
      required: true
      schema: {type: string, example: draft-1}
    AccessRequestId:
      name: requestId
      in: path
      required: true
      description: Идентификатор из поля id. Поле number используется для отображения.
      schema: {type: string, example: request-1042}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID сообщения в чате. Повтор запроса использует тот же ключ и текст.
      schema: {type: string, format: uuid}

  responses:
    BadRequest:
      description: Входные данные не соответствуют контракту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: invalid_input, message: Проверь поля запроса.}
    Unauthorized:
      description: Нужен известный демо-ID в заголовке X-Demo-Employee-Id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: demo_identity_required, message: Введи демо-почту или внутренний ID.}
    Forbidden:
      description: Действие ограничено ролью или требует заполненного профиля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value: {code: forbidden, message: Действие недоступно для этой роли.}
            profileRequired:
              value: {code: profile_required, message: Заполни профиль стажёра.}
    NotFound:
      description: Объект отсутствует или закрыт для текущего пользователя.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: not_found, message: Запрошенный объект недоступен.}

    AccessDraftNotFound:
      description: Черновик отсутствует или принадлежит другому сотруднику.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: draft_not_found, message: Черновик не найден.}
    AccessRequestNotFound:
      description: Заявка отсутствует или недоступна текущему сотруднику.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: request_not_found, message: Заявка не найдена.}
    AccessConflict:
      description: |
        Состояние не допускает операцию. Возможные коды: draft_expired, draft_changed,
        access_already_granted, active_request_exists, request_already_decided, invalid_request_state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: JSON-тело превышает 1 МиБ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: request_too_large, message: Тело запроса слишком большое.}
    UnsupportedMediaType:
      description: Для JSON-тела нужен Content-Type application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: unsupported_media_type, message: Передай тело запроса в формате application/json.}
    InternalError:
      description: Внутренняя ошибка; служебные подробности не передаются клиенту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {code: internal_error, message: Не удалось выполнить запрос. Попробуй позже.}

  schemas:
    MLToolDefinition:
      type: object
      required: [name, description, inputSchema]
      properties:
        name: {type: string, enum: [get_role_tools, check_tool_access, prepare_access_request, get_access_request_status]}
        description: {type: string}
        inputSchema:
          type: object
          additionalProperties: true
          description: JSON Schema аргументов, включая required и additionalProperties=false.

    MLNoArguments:
      type: object
      additionalProperties: false

    MLResourceArguments:
      type: object
      additionalProperties: false
      required: [resourceId]
      properties:
        resourceId: {type: string, minLength: 1, pattern: '\S', example: gitlab-search-api}

    MLRequestArguments:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: {type: string, minLength: 1, pattern: '\S', example: request-1042}

    MLToolAccess:
      type: object
      required: [resourceId, requiredAccessLevel, granted, accessLevel, sufficient]
      properties:
        resourceId: {type: string}
        requiredAccessLevel: {type: string}
        granted: {type: boolean, description: Провайдер подтвердил наличие каких-либо прав.}
        accessLevel: {type: string, description: Фактический уровень; пустой при отсутствии прав.}
        sufficient: {type: boolean, description: Подтверждённый уровень включает требуемые права.}

    MLAccessPreparation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, draft]
          properties:
            status: {type: string, enum: [draft]}
            draft:
              $ref: '#/components/schemas/AccessDraft'
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, enum: [already_granted]}
        - type: object
          additionalProperties: false
          required: [status, request]
          properties:
            status: {type: string, enum: [request_exists]}
            request:
              $ref: '#/components/schemas/AccessRequest'

    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: invalid_input}
        message: {type: string, example: Проверь поля запроса.}

    LoginInput:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          pattern: '\S'
          description: Рабочая почта или внутренний ID сотрудника из тестового справочника.
          example: intern-alina

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/ReadyProfile'
        - $ref: '#/components/schemas/RegistrationRequired'
      discriminator:
        propertyName: status
        mapping:
          ready: '#/components/schemas/ReadyProfile'
          registration_required: '#/components/schemas/RegistrationRequired'

    ReadyProfile:
      type: object
      additionalProperties: false
      required: [status, profile]
      properties:
        status: {type: string, enum: [ready]}
        profile:
          $ref: '#/components/schemas/Profile'

    RegistrationRequired:
      type: object
      additionalProperties: false
      required: [status, employeeId, firstName, secondName, email, role, positionId, team, positionOptions]
      properties:
        status: {type: string, enum: [registration_required]}
        employeeId: {type: string, example: intern-ivan}
        firstName: {type: string, example: Иван}
        secondName: {type: string, example: Петров}
        email: {type: string, format: email, example: ivan.web@example.test}
        role: {type: string, enum: [intern, manager], example: intern}
        positionId: {type: string, example: position-backend-go}
        team:
          $ref: '#/components/schemas/RegistrationTeam'
        positionOptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PositionRef'

    RegistrationTeam:
      allOf:
        - $ref: '#/components/schemas/TeamRef'
        - type: object
          required: [mentors]
          properties:
            mentors:
              type: array
              items:
                $ref: '#/components/schemas/RegistrationMentor'

    RegistrationInput:
      type: object
      additionalProperties: false
      properties:
        positionId: {type: string, minLength: 1, example: position-backend-go}
        mentorId:
          type: string
          minLength: 1
          description: Обязательно для стажёра. Руководитель пропускает поле.
          example: mentor-katya
        internshipStartDate:
          type: string
          format: date
          description: Обязательно для стажёра. Руководитель пропускает поле.
          example: '2026-11-10'

    RegistrationMentor:
      type: object
      required: [id, firstName, secondName]
      properties:
        id: {type: string, example: mentor-katya}
        firstName: {type: string, example: Катя}
        secondName: {type: string, example: Волкова}

    PositionRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, example: position-backend-go}
        name: {type: string, example: Backend-разработчик Go}

    Profile:
      type: object
      required: [id, employeeId, firstName, secondName, email, role, position, team]
      properties:
        id: {type: string, example: profile-intern-alina}
        employeeId: {type: string, example: intern-alina}
        firstName: {type: string, example: Алина}
        secondName: {type: string, example: Смирнова}
        email: {type: string, format: email, example: alina.search@example.test}
        role: {type: string, enum: [intern, manager], example: intern}
        position: {type: string, example: Backend-разработчик Go}
        team:
          $ref: '#/components/schemas/TeamRef'
        mentor:
          $ref: '#/components/schemas/RegistrationMentor'
          description: Заполнен, если у сотрудника назначен наставник.
        internshipStartDate:
          type: string
          format: date
          example: '2026-11-10'
      oneOf:
        - properties:
            role: {type: string, enum: [intern]}
          required: [internshipStartDate]
        - properties:
            role: {type: string, enum: [manager]}

    TeamRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, example: team-search}
        name: {type: string, example: Поиск}

    TaskId:
      type: string
      enum: [team-intro, working-accesses, first-task]

    ChatTaskId:
      type: string
      enum: [team-intro, working-accesses]

    TaskSummary:
      type: object
      required: [id, title, subtitle, status]
      properties:
        id:
          $ref: '#/components/schemas/TaskId'
        title: {type: string, example: Рабочие доступы}
        subtitle: {type: string, example: Ресурсы команды}
        status:
          type: string
          enum: [not_started, in_progress, completed, locked, coming_soon]
          description: |
            team-intro завершается после отметки стажёра.
            working-accesses завершается после подтверждения всех обязательных доступов.
            first-task получает coming_soon после завершения двух рабочих пунктов.
      oneOf:
        - properties:
            id: {type: string, enum: [team-intro, working-accesses]}
            status: {type: string, enum: [not_started, in_progress, completed]}
        - properties:
            id: {type: string, enum: [first-task]}
            status: {type: string, enum: [locked, coming_soon]}

    TaskDetails:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [description, chatEnabled]
          properties:
            description: {type: string, example: Проверь доступы к ресурсам команды.}
            chatEnabled: {type: boolean, example: true}
            teamIntro:
              $ref: '#/components/schemas/TeamIntro'
            workingAccesses:
              $ref: '#/components/schemas/WorkingAccesses'
          oneOf:
            - required: [teamIntro]
              properties:
                id: {type: string, enum: [team-intro]}
                chatEnabled: {type: boolean, enum: [true]}
              not:
                required: [workingAccesses]
            - required: [workingAccesses]
              properties:
                id: {type: string, enum: [working-accesses]}
                chatEnabled: {type: boolean, enum: [true]}
              not:
                required: [teamIntro]
            - properties:
                id: {type: string, enum: [first-task]}
                chatEnabled: {type: boolean, enum: [false]}
              not:
                anyOf:
                  - required: [teamIntro]
                  - required: [workingAccesses]

    Progress:
      type: object
      description: completed показывает число подтверждённых ресурсов и ограничен значением total.
      required: [completed, total]
      properties:
        completed: {type: integer, minimum: 0, example: 2}
        total: {type: integer, minimum: 0, example: 4}

    PlanProgress:
      type: object
      description: Прогресс по трём этапам плана. В MVP два этапа можно завершить.
      required: [completed, total]
      properties:
        completed: {type: integer, minimum: 0, maximum: 2, example: 1}
        total: {type: integer, enum: [3], example: 3}

    OnboardingPlan:
      type: object
      description: |
        progress.completed считается по завершённым карточкам.
        accessProgress считается по подтверждённым обязательным ресурсам.
        nextTaskId указывает на первый незавершённый этап в порядке плана.
      required: [tasks, progress, accessProgress, nextTaskId, accessRequestSummary]
      properties:
        tasks:
          type: array
          minItems: 3
          maxItems: 3
          description: По одной карточке для team-intro, working-accesses и first-task в этом порядке.
          items:
            $ref: '#/components/schemas/TaskSummary'
        progress:
          $ref: '#/components/schemas/PlanProgress'
        accessProgress:
          $ref: '#/components/schemas/Progress'
        nextTaskId:
          $ref: '#/components/schemas/TaskId'
        accessRequestSummary:
          $ref: '#/components/schemas/AccessRequestSummary'
        upcomingMeeting:
          $ref: '#/components/schemas/Meeting'

    AccessRequestSummary:
      type: object
      required: [pending, inProgress, processed]
      properties:
        pending: {type: integer, minimum: 0, description: Число заявок на согласовании., example: 1}
        inProgress: {type: integer, minimum: 0, description: Число заявок на согласовании и выдаче., example: 2}
        processed: {type: integer, minimum: 0, description: Число выданных и отклонённых заявок и заявок с итоговой ошибкой выдачи., example: 2}

    Meeting:
      type: object
      required: [title, mentorName, startsAt, endsAt, format, agenda]
      properties:
        title: {type: string, example: Встреча с наставником}
        mentorName: {type: string, example: Катя Волкова}
        startsAt: {type: string, format: date-time, example: '2026-11-11T11:30:00+03:00'}
        endsAt: {type: string, format: date-time, example: '2026-11-11T12:00:00+03:00'}
        format: {type: string, example: Онлайн}
        agenda: {type: string, example: Обсудить первые дни в команде и рабочие доступы.}

    TeamIntro:
      type: object
      required: [team, description, manager, mentor]
      properties:
        team:
          $ref: '#/components/schemas/TeamRef'
        description: {type: string, example: Команда отвечает за поисковый сервис.}
        manager:
          $ref: '#/components/schemas/Contact'
        mentor:
          $ref: '#/components/schemas/Contact'

    Contact:
      type: object
      required: [fullName, position]
      properties:
        fullName: {type: string, example: Катя Волкова}
        position: {type: string, example: Наставник}
        email: {type: string, format: email, example: katya.volkova@example.test}

    WorkingAccesses:
      type: object
      required: [resources, progress]
      properties:
        resources:
          type: array
          description: Обязательные ресурсы, назначенные команде и роли стажёра.
          items:
            $ref: '#/components/schemas/AccessResource'
        progress:
          allOf:
            - $ref: '#/components/schemas/AccessProgress'
          description: Количество ресурсов с подтверждённым доступом из всех обязательных.

    AccessResource:
      type: object
      required: [id, service, name, accessLevel, purpose, status, canRequest]
      properties:
        id: {type: string, example: gitlab-search-api}
        service: {type: string, example: gitlab}
        name: {type: string, example: GitLab · search-api}
        accessLevel: {type: string, example: Developer}
        purpose: {type: string, example: Код и работа с ветками}
        status: {type: string, enum: [requestable, pending, issuing, granted, failed]}
        canRequest:
          type: boolean
          description: true только для requestable. При failed повторяется прежняя заявка.
        request:
          type: object
          description: Активная заявка для статусов pending, issuing и failed.
          required: [id, number, status]
          properties:
            id: {type: string}
            number: {type: integer, format: int64}
            status: {type: string, enum: [pending, issuing, failed]}

    ChatMessageInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 450
          pattern: '\S'
          example: Кто мой наставник?

    ChatMessage:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: {type: string, example: msg-1}
        role: {type: string, enum: [user, assistant]}
        text: {type: string, example: Твой наставник — Катя Волкова.}
        createdAt: {type: string, format: date-time}
        replyToMessageId: {type: string, description: Исходное сообщение для ответа помощника.}
        sourceLabel: {type: string, example: Карточка команды}
        accessDraft:
          allOf:
            - $ref: '#/components/schemas/AccessDraft'
          description: Карточка черновика в ответе помощника внутри чата рабочих доступов.

    TaskChat:
      type: object
      required: [taskId, messages]
      properties:
        taskId:
          $ref: '#/components/schemas/ChatTaskId'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        latestRun:
          allOf:
            - $ref: '#/components/schemas/ChatRun'
          description: Последняя обработка сообщения. Поле появляется после отправки вопроса.

    ChatRun:
      type: object
      required: [id, userMessageId, status]
      properties:
        id: {type: string, example: run-1}
        userMessageId: {type: string, example: msg-1}
        status: {type: string, enum: [queued, running, completed, failed]}
        assistantMessageId: {type: string, description: Идентификатор сохранённого ответа при completed.}
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
          description: Сообщение об ошибке обработки при failed.
      oneOf:
        - properties:
            status: {type: string, enum: [queued, running]}
          not:
            anyOf:
              - required: [assistantMessageId]
              - required: [error]
        - properties:
            status: {type: string, enum: [completed]}
          required: [assistantMessageId]
          not:
            required: [error]
        - properties:
            status: {type: string, enum: [failed]}
          required: [error]
          not:
            required: [assistantMessageId]

    AccessProgress:
      allOf:
        - $ref: '#/components/schemas/Progress'
        - type: object
          required: [inProgress, failed]
          properties:
            inProgress: {type: integer, minimum: 0, description: Ресурсы на согласовании или выдаче.}
            failed: {type: integer, minimum: 0, description: Ресурсы с ошибкой выдачи.}

    AccessRequestStatus:
      type: string
      enum: [pending, issuing, granted, rejected, failed]
      description: |
        pending — ожидает согласования; issuing — выдаётся; granted — доступ подтверждён;
        rejected — отказ руководителя; failed — ошибка проверки или выдачи.
        failed блокирует создание дубля и допускает повтор существующей заявки.

    AccessRequestParameters:
      type: object
      required: [resourceName, resourceService, resourceExternalId, accessLevel, purpose, approverName]
      properties:
        resourceName: {type: string, example: GitLab · search-api}
        resourceService: {type: string, example: gitlab}
        resourceExternalId: {type: string, example: search/search-api}
        accessLevel: {type: string, example: Developer}
        purpose: {type: string, example: Работа с кодом команды}
        approverName: {type: string, example: Дмитрий Орлов}

    AccessDraft:
      type: object
      description: Черновик одного доступа из серверного инструмента агента.
      required: [id, resourceId, approverId, parameters, createdAt, expiresAt]
      properties:
        id: {type: string, example: draft-1}
        resourceId: {type: string, example: gitlab-search-api}
        approverId: {type: string, example: manager-dmitry}
        parameters:
          $ref: '#/components/schemas/AccessRequestParameters'
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: Срок действия — 15 минут после подготовки.}

    AccessConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: {type: boolean, enum: [true], description: Явное согласие владельца на отправку показанного черновика.}

    AccessRequestCounts:
      type: object
      required: [total, active, completed, pending, issuing, granted, rejected, failed]
      description: Для стажёра — до фильтров; для руководителя — только его очередь pending.
      properties:
        total: {type: integer, format: int64, minimum: 0}
        active: {type: integer, format: int64, minimum: 0, description: pending + issuing + failed.}
        completed: {type: integer, format: int64, minimum: 0, description: granted + rejected.}
        pending: {type: integer, format: int64, minimum: 0}
        issuing: {type: integer, format: int64, minimum: 0}
        granted: {type: integer, format: int64, minimum: 0}
        rejected: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}

    AccessRequestList:
      type: object
      required: [items, total, counts, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
        total: {type: integer, format: int64, minimum: 0, description: Размер списка после фильтров и до пагинации.}
        counts:
          $ref: '#/components/schemas/AccessRequestCounts'
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}

    AccessRequest:
      type: object
      required: [id, number, draftId, employeeId, resourceId, approverId, parameters, status, createdAt, updatedAt]
      properties:
        id: {type: string, example: request-1042}
        number: {type: integer, format: int64, minimum: 1, example: 1042}
        draftId: {type: string, example: draft-1}
        employeeId: {type: string, example: intern-alina}
        resourceId: {type: string, example: gitlab-search-api}
        approverId: {type: string, example: manager-dmitry}
        parameters:
          $ref: '#/components/schemas/AccessRequestParameters'
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
        decisionReason: {type: string, description: Причина решения; обязательна при отказе.}
        grantedAt: {type: string, format: date-time}
        lastError: {type: string, description: Понятное сообщение об ошибке выдачи.}

    AccessDecision:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: {type: string, enum: [approve]}
            reason: {type: string, maxLength: 2000}
        - type: object
          additionalProperties: false
          required: [decision, reason]
          properties:
            decision: {type: string, enum: [reject]}
            reason:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: '\S'
              description: Причина отказа. Пробелы по краям удаляются перед проверкой.
