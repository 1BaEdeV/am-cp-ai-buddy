# Вымышленные учебные команды для демонстрации.
teams:
  - id: "team-search"
    name: "Поиск"
    description: "Учебная демо-команда. Команда развивает поисковый сервис: качество выдачи, индексирование и API поиска. Индексирование подготавливает объявления к быстрому поиску, а ранжирование определяет порядок результатов. Учебные задачи: проверить обработку поискового запроса, добавить тест API или найти причину изменения метрик. Стажёр работает в search-api, обсуждает изменения в GitLab и сверяет результат по учебным дашбордам Grafana. В начале изучи путь запроса, запусти тесты и обсуди с наставником один небольшой дефект."

  - id: "team-web"
    name: "Веб-интерфейсы"
    description: "Учебная демо-команда. Команда создаёт учебные веб-интерфейсы: формы, карточки и навигацию. Работает с React и TypeScript, проверяет доступность и поведение на телефоне. Дизайн берётся из Figma, код находится в onboarding-lab, задачи — в YouTrack. В первую неделю запусти интерфейс, изучи компоненты и внеси небольшое исправление формы с тестом. Изменения обсуждаются в merge request; наставник проверяет код и состояния загрузки, ошибки и пустых данных."

  - id: "team-trust"
    name: "Доверие и безопасность"
    description: "Учебная демо-команда. Команда разбирает учебные сценарии доверия и безопасности объявлений. Пишет Python-сервисы обработки сигналов и проверяет правила на обезличенных данных. Используются onboarding-lab, учебная PostgreSQL и YouTrack. Первая задача — воспроизвести один пограничный случай, написать тест и описать ожидаемое решение правила. Любое изменение обсуждается с наставником; реальные персональные данные и производственные решения в демо не используются."

  - id: "team-quality"
    name: "Качество продукта"
    description: "Учебная демо-команда. Команда проверяет учебный сервис и предотвращает регрессии. Готовит тест-кейсы, проверяет API, исследует ошибки и смотрит метрики учебного окружения. Используются YouTrack, GitLab с кодом и результатами сборок, Grafana. В начале воспроизведи небольшой дефект, зафиксируй шаги, ожидаемый и фактический результат. Затем вместе с наставником выбери проверку, которая защитит этот сценарий при следующем изменении."

  - id: "team-analytics"
    name: "Продуктовая аналитика"
    description: "Учебная демо-команда. Команда исследует учебные продуктовые метрики: просмотры, переходы и обращения. Проверяет качество данных, пишет SQL и собирает отчёты в Metabase. Данные находятся только в учебной PostgreSQL. Первая задача — описать метрику, проверить знаменатель и посчитать её на небольшом наборе данных. Перед публикацией отчёта наставник проверяет фильтры, пропуски и возможность повторить расчёт; выводы отделяются от предположений."

  - id: "team-recommendations"
    name: "Рекомендации"
    description: "Учебная демо-команда. Команда исследует рекомендации объявлений на учебных обезличенных данных. Готовит признаки, сравнивает простые модели и оценивает качество без использования production. Используются JupyterHub и S3 с учебными датасетами. В первую неделю воспроизведи базовый ноутбук, проверь разделение выборок и опиши метрику качества. Изменения должны быть воспроизводимыми: фиксируются параметры, версия данных и результат сравнения."

  - id: "team-ml-platform"
    name: "ML-платформа"
    description: "Учебная демо-команда. Команда строит учебные инструменты запуска и проверки ML-пайплайнов. Отвечает за подготовку данных, воспроизводимый запуск и сохранение артефактов модели. Код находится в onboarding-lab, проверки — в JupyterHub, артефакты — в учебном S3. Первый шаг — повторить готовый запуск и проверить, где записаны параметры и результат. Для изменения пайплайна нужны тесты и понятное описание, как восстановить запуск после сбоя."

  - id: "team-infrastructure"
    name: "Инфраструктура"
    description: "Учебная демо-команда. Команда поддерживает учебное окружение: контейнеры, конфигурацию сервисов и наблюдаемость. Разбирает доступность, логи и метрики, не меняя production. Код конфигураций находится в onboarding-lab, дашборды — в Grafana. Первая задача — поднять сервис локально, проверить состояние контейнера и описать диагностику одного сбоя. Изменения конфигураций проходят ревью; секреты хранятся вне репозитория."

  - id: "team-design"
    name: "Продуктовый дизайн"
    description: "Учебная демо-команда. Команда проектирует учебные пользовательские сценарии и интерфейсы. Работает с макетами Figma, состояниями компонентов и передачей решения разработчикам. Задачи и вопросы фиксируются в YouTrack. В начале разберись в одном сценарии, найди состояния ошибки и пустого списка и подготовь небольшой вариант улучшения. На ревью объясни задачу пользователя, ограничения и критерии проверки; визуальное решение оценивается вместе с доступностью."

  - id: "team-experiments"
    name: "Платформа экспериментов"
    description: "Учебная демо-команда. Команда разбирает учебные эксперименты и проверяет корректность выводов. Готовит определения метрик, анализирует группы и формулирует ограничения. Используются Metabase и JupyterHub с учебными данными. Первая задача — проверить сравнимость групп и посчитать одну заранее выбранную метрику. Результат должен содержать метод расчёта, неопределённость и оговорки; рост одной метрики без проверки качества не считается готовым выводом."
